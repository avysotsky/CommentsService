services:
  database:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: comments
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Generate an environment file first}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Generate an environment file first}
    volumes:
      - development_data:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env.broker
        required: false
      - path: .env.search
        required: false
      - path: .env.cloud
        required: false
    volumes:
      - application_logs:/app/logs
    environment:
      PGHOST: database
      PGDATABASE: comments
      PGUSER: comments_app
      PGPASSWORD: ${DB_APP_PASSWORD:?Generate an environment file first}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  test-database:
    profiles: [testing]
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: comments_test
      POSTGRES_PASSWORD: ${TEST_DB_ADMIN_PASSWORD:?Generate an environment file first}
      APP_DB_PASSWORD: ${TEST_DB_APP_PASSWORD:?Generate an environment file first}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55434}:5432"
    volumes:
      - test_data:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  broker:
    profiles: [broker]
    image: rabbitmq:4.4.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${RABBITMQ_DEFAULT_USER:?Generate the private broker environment first}"; : "$${RABBITMQ_DEFAULT_PASS:?Generate the private broker environment first}"; exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server'
    env_file:
      - path: .env.broker
        required: false
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit disk_free_limit 33554432 -rabbit vm_memory_high_watermark 0.6"
    tmpfs:
      - /var/lib/rabbitmq:size=134217728,mode=1777
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    profiles: [search]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    env_file:
      - path: .env.elasticsearch
        required: false
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      node.store.allow_mmap: "false"
      action.auto_create_index: "false"
      cluster.routing.allocation.disk.watermark.low: 3gb
      cluster.routing.allocation.disk.watermark.high: 2gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - search_data:/usr/share/elasticsearch/data
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -q 401"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

volumes:
  search_data:
  application_logs:
  development_data:
  test_data:
